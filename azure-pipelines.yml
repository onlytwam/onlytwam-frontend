trigger:
  branches:
    include:
      - testing                    # ✅ push → build only
      - main                       # ✅ merge → build + deploy

pr:
  branches:
    include:
      - main                       # ✅ PR raised → build only, no deploy

pool:
  vmImage: ubuntu-latest

variables:
  - group: twam-live-secrets

steps:
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: "20.x"

  - script: node --version && npm --version
    displayName: Verify Node version

  - script: npm install
    displayName: Install dependencies

  - script: npx vite build
    displayName: Build frontend
    env:
      VITE_API_BASE_URL: $(VITE_API_BASE_URL)    # ✅ changed from $(BACKEND_URL)
      VITE_APP_NAME: $(VITE_APP_NAME)

  # ✅ Deploy ONLY when merged to main
  - task: AzureStaticWebApp@0
    displayName: Deploy to Static Web Apps
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    inputs:
      app_location: "/"
      output_location: "dist"
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)