trigger:
  branches:
    include:
      - develop                    # ✅ merge → build + deploy
      - frontend-setup/Vishnu      # ✅ push → build only
      - feature/*  
      - frontend/v2/Mamatha                # ✅ any future feature branch → build only
      - frontend-setup/Eshwar 
pr:
  branches:
    include:
      - develop                    # ✅ PR raised → build only, no deploy

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: "20.x"

  - script: node --version && npm --version
    displayName: Verify Node version

  - script: npm install
    displayName: Install dependencies

  - script: npx vite build
    displayName: Build frontend
    env:
      VITE_API_BASE_URL: $(VITE_API_BASE_URL)
      VITE_APP_NAME: $(VITE_APP_NAME)

  # ✅ Deploy ONLY when merged to develop — never on feature branches or PRs
  - task: AzureStaticWebApp@0
    displayName: Deploy to Static Web Apps
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), in(variables['Build.Reason'], 'IndividualCI', 'Manual'))
    inputs:
      app_location: "dist"
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)