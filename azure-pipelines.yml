trigger:
  branches:
    include:
      - develop          # ✅ Triggers on every merge/push to develop

pr:
  branches:
    include:
      - develop          # ✅ Runs build validation on PRs targeting develop (no deploy)

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: "20.x"

  - script: node --version && npm --version
    displayName: Verify Node version

  - script: |
      sudo apt-get install -y build-essential libvips-dev
    displayName: Install native build tools for sharp

  - script: npm install
    displayName: Install dependencies

  - script: npx vite build
    displayName: Build frontend
    env:
      VITE_API_BASE_URL: $(VITE_API_BASE_URL)
      VITE_APP_NAME: $(VITE_APP_NAME)

  - task: AzureStaticWebApp@0
    displayName: Deploy to Static Web Apps
    condition: and(succeeded(), eq(variables['Build.Reason'], 'IndividualCI'))
    # ☝️ This ensures deploy ONLY happens on actual merges to develop, NOT on PR builds
    inputs:
      app_location: "dist"
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)