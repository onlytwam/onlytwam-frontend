trigger:
  branches:
    include:
      - frontend-setup/Vishnu

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@1
    displayName: Install Node.js
    inputs:
      versionSpec: '20.x'

  # ✅ FIX 1: ignore-scripts stops sharp from trying to compile libvips
  - script: npm install --ignore-scripts
    displayName: Install dependencies
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: 1
      npm_config_platform: linux
      npm_config_arch: x64

  - script: npx vite build
    displayName: Build frontend
    env:
      VITE_API_BASE_URL: $(VITE_API_BASE_URL)
      VITE_APP_NAME: $(VITE_APP_NAME)

  # ✅ FIX 2: app_location = source root, output_location = dist
  - task: AzureStaticWebApp@0
    displayName: Deploy to Static Web Apps
    inputs:
      app_location: '/'               # ← root of your repo
      output_location: 'dist'         # ← where vite builds to
      skip_app_build: true
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)