trigger:
  branches:
    include:
      - frontend/v2/Mamatha    # ✅ Only triggers on this branch

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1 
    displayName: Install Node.js
    inputs:
      versionSpec: "20.x"

  - script: node --version && npm --version
    displayName: Verify Node version

  - script: |
      sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
      sudo apt-get update -y
      sudo apt-get install -y --fix-missing build-essential libvips-dev
    displayName: Install native build tools for sharp 

  - script: npm install
    displayName: Install dependencies

  - script: npx vite build
    displayName: Build frontend
    env:
      VITE_API_BASE_URL: $(VITE_API_BASE_URL)
      VITE_APP_NAME: $(VITE_APP_NAME)

  # ❌ No deploy step here — build only